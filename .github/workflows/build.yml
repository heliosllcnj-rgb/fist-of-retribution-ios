# Builds the phone versions of Fist of Retribution: Project Zero on GitHub's runners.
#   iOS      -> FistOfRetribution-unsigned.ipa  (install with Sideloadly or AltStore)
#   Android  -> FistOfRetribution.apk           (open on the phone to install)
#   Windows  -> FistOfRetribution-Windows.zip   (unzip, run FistOfRetribution.exe)
#   Mac      -> FistOfRetribution-Mac.zip       (Apple silicon; unzip, open "Fist of Retribution.app")
# Both files are published on the repo's Releases page under "Phone builds (latest)" and replaced on every push.
# How it works: the IKEMEN GO engine is fetched at a fixed commit, patches/engine.patch is applied
# (picture at the top of a tall screen, portrait, our menus as the default), the game in game/ is copied
# into the engine tree, and the engine's own build script packages it with the app shell in ios-wrapper/.
name: Build the game
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which versions to build (any of: ios android windows mac)"
        default: "ios android windows mac"
  push:
    branches: [main]
    paths-ignore: ['README.md']

permissions:
  contents: write

env:
  ENGINE_REPO: https://github.com/ikemen-engine/ikemen-go.git
  ENGINE_SHA: 54d4148a728153c2097a0fb899a06812b2d3e193

jobs:
  ios:
    if: github.event_name == 'push' || contains(inputs.targets, 'ios')
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the engine and apply our patch
        run: |
          set -euo pipefail
          git init -q engine
          cd engine
          git config core.autocrlf false
          git remote add origin "$ENGINE_REPO"
          git fetch -q --depth 1 origin "$ENGINE_SHA"
          git checkout -q FETCH_HEAD
          git apply --verbose ../patches/engine.patch

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: engine/go.sum

      - name: Host tools
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1
          brew install --quiet pkg-config git nasm || true
          xcodebuild -version

      - name: Put the game into the engine tree
        run: |
          set -euo pipefail
          for d in chars data external font sound stages; do
            mkdir -p "engine/$d"
            cp -R "game/$d/." "engine/$d/"
          done
          # every build re-unpacks the game on first launch
          sed -i '' "s/FOR_BUILD_STAMP/${GITHUB_SHA:0:12}/" ios-wrapper/I.K.E.M.E.N-Go/ViewController.m
          du -sh engine/chars engine/data engine/stages engine/sound

      - name: Build the IPA (unsigned)
        env:
          BUILD_FFMPEG: "yes"
          IOS_WRAPPER_DIR: ${{ github.workspace }}/ios-wrapper
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_APP_VERSION: "0.1.0"
        run: |
          set -o pipefail
          cd engine
          chmod +x build/build.sh
          ./build/build.sh iOS > ../build-ios.log 2>&1 || { grep -n -E "error:|ERROR|fatal" ../build-ios.log | tail -60; echo "----- last lines -----"; tail -n 120 ../build-ios.log; exit 1; }
          tail -n 15 ../build-ios.log
          cp bin/ikemen-go.ipa ../FistOfRetribution-unsigned.ipa
          ls -la ../FistOfRetribution-unsigned.ipa

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view phone-builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create phone-builds -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Phone builds (latest)" \
              --notes "Newest iPhone and Android builds of Fist of Retribution: Project Zero. Replaced on every push." || true
          gh release upload phone-builds FistOfRetribution-unsigned.ipa --clobber -R "$GITHUB_REPOSITORY"

  android:
    if: github.event_name == 'push' || contains(inputs.targets, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the engine and apply our patch
        run: |
          set -euo pipefail
          git init -q engine
          cd engine
          git config core.autocrlf false
          git remote add origin "$ENGINE_REPO"
          git fetch -q --depth 1 origin "$ENGINE_SHA"
          git checkout -q FETCH_HEAD
          git apply --verbose ../patches/engine.patch

      - name: Put the game and the app shell into the engine tree
        run: |
          set -euo pipefail
          for d in chars data external font sound stages; do
            mkdir -p "engine/$d"
            cp -R "game/$d/." "engine/$d/"
          done
          mkdir -p engine/build/android-apk
          cp -R android-wrapper engine/build/android-apk/ikemen-droid
          # every build re-unpacks the game on first launch
          sed -i "s/FOR_BUILD_STAMP/${GITHUB_SHA:0:12}/" engine/build/android-apk/ikemen-droid/app/src/main/java/org/libsdl/app/SDLActivity.java
          # the app unpacks exactly the files listed here (one per line)
          ( cd engine && { find chars data external font sound stages -type f; echo external/gamecontrollerdb.txt; echo data/system.base.def; } \
              | grep -v ' ' | sort -u ) > engine/build/android-apk/ikemen-droid/app/src/main/assets/manifest.txt
          wc -l engine/build/android-apk/ikemen-droid/app/src/main/assets/manifest.txt

      - name: Build the APK
        run: |
          set -o pipefail
          cd engine
          DC="docker compose -f build/docker/android/docker-compose.yml"
          show() { grep -n -E "error:|ERROR|FAILED|What went wrong" ../build-android.log | tail -60; echo "----- last lines -----"; tail -n 150 ../build-android.log; }
          $DC build android-build > ../build-android.log 2>&1 || { show; exit 1; }
          $DC run --rm -e ANDROID_APK_REPO=/work/build/android-apk/ikemen-droid android-build >> ../build-android.log 2>&1 || { show; exit 1; }
          tail -n 15 ../build-android.log
          cp bin/ikemen-go.apk ../FistOfRetribution.apk
          ls -la ../FistOfRetribution.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh release view phone-builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create phone-builds -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Phone builds (latest)" \
              --notes "Newest iPhone and Android builds of Fist of Retribution: Project Zero. Replaced on every push." || true
          gh release upload phone-builds FistOfRetribution.apk --clobber -R "$GITHUB_REPOSITORY"

  windows:
    if: github.event_name == 'push' || contains(inputs.targets, 'windows')
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the engine and apply our patch
        shell: bash
        run: |
          set -euo pipefail
          git init -q engine
          cd engine
          git config core.autocrlf false
          git remote add origin "$ENGINE_REPO"
          git fetch -q --depth 1 origin "$ENGINE_SHA"
          git checkout -q FETCH_HEAD
          git apply --verbose ../patches/engine.patch

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: engine/go.sum

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            diffutils
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libxmp

      - uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build the engine
        shell: 'msys2 {0}'
        env:
          BUILD_FFMPEG: "yes"
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          cd engine
          go env -w GO111MODULE=on
          go mod download
          ./build/build.sh Win64 > ../build-windows.log 2>&1 || { grep -n -E "error:|ERROR|fatal" ../build-windows.log | tail -60; echo "----- last lines -----"; tail -n 150 ../build-windows.log; exit 1; }
          tail -n 15 ../build-windows.log
          ls -la Ikemen_GO.exe lib

      - name: Put the game together
        shell: bash
        run: |
          set -euo pipefail
          out="deploy/FistOfRetribution"
          mkdir -p "$out"
          cp engine/Ikemen_GO.exe "$out/FistOfRetribution.exe"
          cp -R engine/lib "$out/lib"
          for d in data external font; do cp -R "engine/$d" "$out/$d"; done
          for d in chars data external font sound stages; do
            mkdir -p "$out/$d"
            cp -R "game/$d/." "$out/$d/"
          done
          [ -f "$out/data/system.base.def" ] || cp engine/src/resources/defaultMotif.ini "$out/data/system.base.def"
          [ -f "$out/external/gamecontrollerdb.txt" ] || curl -fsSL -o "$out/external/gamecontrollerdb.txt" \
            "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/refs/heads/master/gamecontrollerdb.txt" || true
          mkdir -p "$out/save"
          cp engine/LICENCE.txt "$out/ENGINE-LICENCE.txt" || true
          ( cd deploy && "/c/Program Files/7-Zip/7z.exe" a -tzip -mx=5 ../FistOfRetribution-Windows.zip FistOfRetribution > /dev/null )
          ls -la FistOfRetribution-Windows.zip

      - name: Publish on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view phone-builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create phone-builds -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Phone builds (latest)" \
              --notes "Newest builds of Fist of Retribution: Project Zero. Replaced on every push." || true
          gh release upload phone-builds FistOfRetribution-Windows.zip --clobber -R "$GITHUB_REPOSITORY"

  mac:
    if: github.event_name == 'push' || contains(inputs.targets, 'mac')
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the engine and apply our patch
        run: |
          set -euo pipefail
          git init -q engine
          cd engine
          git config core.autocrlf false
          git remote add origin "$ENGINE_REPO"
          git fetch -q --depth 1 origin "$ENGINE_SHA"
          git checkout -q FETCH_HEAD
          git apply --verbose ../patches/engine.patch

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: engine/go.sum

      - uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Host libraries
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1
          brew install --quiet pkg-config git nasm libxmp sdl2 molten-vk || brew install --quiet pkg-config git nasm libxmp sdl2 molten-vk

      - name: Build the engine (Apple silicon)
        env:
          BUILD_FFMPEG: "yes"
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -o pipefail
          cd engine
          go env -w GO111MODULE=on
          go mod download
          ./build/build.sh MacOSARM > ../build-mac.log 2>&1 || { grep -n -E "error:|ERROR|fatal" ../build-mac.log | tail -60; echo "----- last lines -----"; tail -n 150 ../build-mac.log; exit 1; }
          tail -n 15 ../build-mac.log
          ls -la bin lib

      - name: Put the app together
        run: |
          set -euo pipefail
          app="deploy/Fist of Retribution.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/Resources/game"
          cp engine/bin/Ikemen_GO_MacOSARM "$app/Contents/MacOS/FistOfRetribution"
          cp mac-wrapper/launch.sh "$app/Contents/MacOS/launch.sh"
          chmod +x "$app/Contents/MacOS/FistOfRetribution" "$app/Contents/MacOS/launch.sh"
          cp engine/lib/*.dylib "$app/Contents/Frameworks/" 2>/dev/null || true
          sed "s/FOR_BUILD_NUMBER/${GITHUB_RUN_NUMBER}/" mac-wrapper/Info.plist > "$app/Contents/Info.plist"
          # icon
          set_dir=$(mktemp -d)/icon.iconset; mkdir -p "$set_dir"
          for s in 16 32 128 256 512; do
            sips -z $s $s mac-wrapper/icon_1024.png --out "$set_dir/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) mac-wrapper/icon_1024.png --out "$set_dir/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set_dir" -o "$app/Contents/Resources/icon.icns"
          # the game: engine defaults first, our files on top (same as the Windows build)
          g="$app/Contents/Resources/game"
          for d in data external font; do mkdir -p "$g/$d"; cp -R "engine/$d/." "$g/$d/"; done
          for d in chars data external font sound stages; do mkdir -p "$g/$d"; cp -R "game/$d/." "$g/$d/"; done
          [ -f "$g/data/system.base.def" ] || cp engine/src/resources/defaultMotif.ini "$g/data/system.base.def"
          [ -f "$g/external/gamecontrollerdb.txt" ] || curl -fsSL -o "$g/external/gamecontrollerdb.txt" \
            "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/refs/heads/master/gamecontrollerdb.txt" || true
          echo "${GITHUB_SHA:0:12}" > "$g/.build"
          # ad-hoc signature so Apple silicon will run it (not notarised: first open needs "Open Anyway")
          codesign --force --sign - "$app/Contents/Frameworks/"*.dylib 2>/dev/null || true
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --verbose=2 "$app" || true
          otool -L "$app/Contents/MacOS/FistOfRetribution" | head -30
          cp "mac-wrapper/How to open on Mac.txt" deploy/
          cp engine/LICENCE.txt deploy/ENGINE-LICENCE.txt || true
          ( cd deploy && ditto -c -k --sequesterRsrc --keepParent . ../FistOfRetribution-Mac.zip )
          ls -la FistOfRetribution-Mac.zip

      - name: Smoke test (starts and stays up)
        run: |
          app="deploy/Fist of Retribution.app"
          "$app/Contents/MacOS/launch.sh" > smoke.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then echo "still running after 25s: OK"; kill $pid; else echo "exited early:"; fi
          tail -n 40 smoke.log || true
          ls "$HOME/Library/Application Support/FistOfRetribution" || true

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 40
          gh release view phone-builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create phone-builds -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Phone builds (latest)" \
              --notes "Newest builds of Fist of Retribution: Project Zero. Replaced on every push." || true
          gh release upload phone-builds FistOfRetribution-Mac.zip --clobber -R "$GITHUB_REPOSITORY"
